<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in chat (baseline test)</title>
<style>
  :root {
    --bg: #f6f4fa;
    --panel: #ffffff;
    --ink: #1f1830;
    --muted: #6b6480;
    --line: #e2dded;
    --accent: #5b2ea6;
    --accent-ink: #ffffff;
    --bot: #efeaf8;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15111f;
      --panel: #1e182c;
      --ink: #f1edf9;
      --muted: #a79fbd;
      --line: #342b48;
      --accent: #a98bea;
      --accent-ink: #15111f;
      --bot: #2a2240;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .tag {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
    margin-left: 8px;
    font-weight: 500;
  }
  .controls { display: flex; gap: 8px; align-items: center; }
  .controls label { font-size: 13px; color: var(--muted); }
  select, button, input[type="text"] {
    font: inherit;
    color: inherit;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    padding: 8px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; }
  .note { align-self: center; font-size: 13px; color: var(--muted); }
  .typing span {
    display: inline-block; width: 6px; height: 6px; margin: 0 2px;
    border-radius: 50%; background: var(--muted);
    animation: blink 1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; } }
  .summary {
    align-self: stretch;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .summary h2 { font-size: 16px; margin: 0 0 8px; }
  .summary dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 8px; }
  .summary dt { font-size: 13px; color: var(--muted); }
  .summary dd { margin: 0; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 18px; }
  #chips:not(:empty) { padding-bottom: 10px; }
  #chips button { border-radius: 999px; border-color: var(--accent); }
  form {
    display: flex;
    gap: 8px;
    padding: 12px 18px 18px;
    border-top: 1px solid var(--line);
  }
  form input { flex: 1; min-width: 0; }
  form button { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  form button:disabled, form input:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Check-in chat <span class="tag">baseline test</span></h1>
    <div class="controls">
      <label for="profile">Profile</label>
      <select id="profile"></select>
      <button type="button" id="restart">Restart</button>
    </div>
  </header>

  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div id="chips" aria-label="Quick replies"></div>

  <form id="form" autocomplete="off">
    <input type="text" id="input" aria-label="Your answer" placeholder="Type your answer">
    <button type="submit" id="send">Send</button>
  </form>
</div>

<script>
/* ------------------------------------------------------------------
   CONTENT: edit these lists to change what the chat asks.
   Everything here is placeholder text for testing the display.
   type: "text" = free typing, "choice" = quick-reply buttons.
------------------------------------------------------------------- */
const PROFILES = [
  { id: "a", name: "Sample profile A", group: "A" },
  { id: "b", name: "Sample profile B", group: "B" }
];

// Asked for every profile.
const CORE_QUESTIONS = [
  { id: "name",  type: "text",   text: "Hi! This is a test of the chat display. What should I call you?" },
  { id: "topic", type: "text",   text: "Thanks, {name}. Placeholder question 1: what would you like to talk about today?" },
  { id: "scale", type: "choice", text: "Placeholder question 2: pick one of these options.",
    options: ["Option one", "Option two", "Option three"] }
];

// Asked only for the matching profile group. Keep both lists the same length.
const MODULES = {
  A: [
    { id: "a1", type: "choice", text: "Profile A question: this only appears for group A. Yes or no?", options: ["Yes", "No"] },
    { id: "a2", type: "text",   text: "Profile A follow-up: anything to add?" }
  ],
  B: [
    { id: "b1", type: "choice", text: "Profile B question: this only appears for group B. Yes or no?", options: ["Yes", "No"] },
    { id: "b2", type: "text",   text: "Profile B follow-up: anything to add?" }
  ]
};

/* ------------------------------------------------------------------
   ENGINE: no need to edit below to change questions.
------------------------------------------------------------------- */
const log = document.getElementById("log");
const chips = document.getElementById("chips");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const profileSelect = document.getElementById("profile");
const restartBtn = document.getElementById("restart");

let queue = [];
let answers = [];
let current = null;
let runId = 0;

function addMessage(text, who) {
  const el = document.createElement("div");
  el.className = "msg " + who;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addNote(text) {
  const el = document.createElement("div");
  el.className = "note";
  el.textContent = text;
  log.appendChild(el);
}

function fill(text) {
  return text.replace(/\{(\w+)\}/g, function (_, key) {
    const found = answers.find(function (a) { return a.id === key; });
    return found ? found.answer : "";
  });
}

function setInputEnabled(on, placeholder) {
  input.disabled = !on;
  send.disabled = !on;
  input.placeholder = placeholder;
  if (on) input.focus();
}

function botSay(text, then) {
  const myRun = runId;
  const typing = document.createElement("div");
  typing.className = "msg bot typing";
  typing.setAttribute("aria-hidden", "true");
  typing.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(typing);
  log.scrollTop = log.scrollHeight;
  setTimeout(function () {
    typing.remove();
    if (myRun !== runId) return;
    addMessage(text, "bot");
    if (then) then();
  }, 500);
}

function askNext() {
  chips.innerHTML = "";
  current = queue.shift() || null;
  if (!current) { finish(); return; }
  setInputEnabled(false, "…");
  botSay(fill(current.text), function () {
    if (current.type === "choice") {
      current.options.forEach(function (opt) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = opt;
        b.addEventListener("click", function () { receive(opt); });
        chips.appendChild(b);
      });
      setInputEnabled(false, "Choose an option above");
      chips.firstChild.focus();
    } else {
      setInputEnabled(true, "Type your answer");
    }
  });
}

function receive(text) {
  const value = text.trim();
  if (!value || !current) return;
  addMessage(value, "user");
  answers.push({ id: current.id, question: fill(current.text), answer: value });
  input.value = "";
  askNext();
}

function finish() {
  setInputEnabled(false, "Chat finished. Press Restart to try again.");
  botSay("That's everything. Here is a summary of what you told me.", function () {
    const card = document.createElement("section");
    card.className = "summary";
    const h = document.createElement("h2");
    h.textContent = "Summary (" + profileSelect.selectedOptions[0].textContent + ")";
    const dl = document.createElement("dl");
    answers.forEach(function (a) {
      const row = document.createElement("div");
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = a.question;
      dd.textContent = a.answer;
      row.appendChild(dt);
      row.appendChild(dd);
      dl.appendChild(row);
    });
    card.appendChild(h);
    card.appendChild(dl);
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;
  });
}

function start() {
  runId++;
  const profile = PROFILES.find(function (p) { return p.id === profileSelect.value; });
  log.innerHTML = "";
  chips.innerHTML = "";
  answers = [];
  queue = CORE_QUESTIONS.concat(MODULES[profile.group] || []);
  addNote("Test display with placeholder questions. Using " + profile.name + ".");
  askNext();
}

PROFILES.forEach(function (p) {
  const o = document.createElement("option");
  o.value = p.id;
  o.textContent = p.name;
  profileSelect.appendChild(o);
});

form.addEventListener("submit", function (e) {
  e.preventDefault();
  if (!input.disabled) receive(input.value);
});
profileSelect.addEventListener("change", start);
restartBtn.addEventListener("click", start);

start();
</script>
</body>
</html>
